# Blueprint de Render: ambas APIs en el plan gratuito (sin tarjeta).
# El plan gratuito no tiene red privada: Go llama a Node por su URL pública
# (STATS_API_URL, definida en el dashboard).
envVarGroups:
  - name: qr-stats-shared
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_PASSWORD
        sync: false

services:
  - type: web
    name: qr-stats-node-api
    runtime: docker
    plan: free
    dockerContext: ./node-api
    dockerfilePath: ./node-api/Dockerfile
    healthCheckPath: /health
    envVars:
      - fromGroup: qr-stats-shared

  - type: web
    name: qr-stats-go-api
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./go-api/Dockerfile
    healthCheckPath: /health
    envVars:
      - fromGroup: qr-stats-shared
      # p. ej. https://qr-stats-node-api.onrender.com (sin barra final)
      - key: STATS_API_URL
        sync: false
